name: sonho_de_crianca
description: "Projeto de aplicativo para monitoramento de brinquedo."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.5 <4.0.0"
  flutter: "3.44.6"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#F3F2F2"
  adaptive_icon_foreground: "assets/icon/icon-foreground-1024.png"
  remove_alpha_ios: true



flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/category/
